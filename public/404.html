<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>La Rosa TV</title>
    <script type="text/javascript">
      // Truco estándar para que GitHub Pages soporte rutas de una SPA
      // (ej. /admin/) sin un servidor real. Ver: spa-github-pages.
      var pathSegmentsToKeep = 1 // número de segmentos del "base", ej /Streaming-la-rosa/
      var l = window.location
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      )
    </script>
  </head>
  <body></body>
</html>
